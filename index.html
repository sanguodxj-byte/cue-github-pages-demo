<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="GitHub Pages 静态站点部署测试页面。">
  <title>GitHub Pages 部署测试</title>
  <style>
    :root { color-scheme: dark; --ink:#eef2ff; --muted:#aab4cf; --line:rgba(255,255,255,.14); --accent:#92f0c5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; color:var(--ink); font:16px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 20% 10%,#23365a 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#17433d 0,transparent 35%),#101522; }
    main { width:min(720px,100%); padding:clamp(28px,7vw,64px); border:1px solid var(--line); border-radius:28px; background:rgba(17,23,38,.78); box-shadow:0 28px 90px rgba(0,0,0,.32); }
    .badge { display:inline-flex; align-items:center; gap:9px; padding:7px 12px; border:1px solid rgba(146,240,197,.35); border-radius:999px; color:var(--accent); font-size:13px; letter-spacing:.04em; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent); }
    h1 { margin:26px 0 12px; font-size:clamp(36px,8vw,58px); line-height:1.1; letter-spacing:-.045em; }
    p { margin:0; color:var(--muted); }
    .lead { max-width:540px; font-size:19px; }
    .rule { height:1px; margin:34px 0 22px; background:var(--line); }
    .note { font-size:14px; }
    footer { margin-top:38px; color:#78839d; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="dot" aria-hidden="true"></span>发布测试 · 2026年10月</span>
    <h1>GitHub Pages<br>部署测试</h1>
    <p class="lead">如果你能看到这个页面，说明静态站点已成功发布。</p>
    <div class="rule"></div>
    <p class="note">这是一个临时示例页面，用于验证 GitHub Pages 部署流程。未收集或展示个人信息。</p>
    <footer>由 GitHub Pages 提供静态托管。</footer>
  </main>
</body>
</html>
